[workspace]
members = ["crates/openkart", "crates/openkart-web", "tools/osm2track"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.82"

# The WebAssembly build: small and fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
